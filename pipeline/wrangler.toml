name = "pin-pipeline"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Non-secret configuration. Secrets never live here — see README.md.
[vars]
GH_REPO   = "orchimada/orchimada.github.io"
GH_BRANCH = "master"
GH_PATH   = "pins.json"
SITE_URL  = "https://orchimada.github.io/pins.html"

# Your Telegram numeric user id — the only account allowed to write.
TG_OWNER_ID = "101917855"   # @orchimada

# Channel to mirror into — numeric id, so a rename or a switch to private
# does not break the fan-out. Empty publishes to the site only.
TG_CHANNEL_ID = "-1003238647935"   # @orchipins

# Bluesky handle, e.g. "orchimada.bsky.social". Deliberately off for now — set
# this plus the BSKY_PASSWORD secret and redeploy to turn the fan-out on.
BSKY_HANDLE = ""
