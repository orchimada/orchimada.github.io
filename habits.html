*{box-sizing:border-box}
body{margin:0;background:var(--milk);color:var(--ink);font-family:var(--sans);line-height:1.55}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

/* ── chrome ── */
.bar{border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.bar a{text-decoration:none}
.bar .who{color:var(--ink);font-weight:500}
.bar .links{display:flex;gap:18px}
.bar a:hover{color:var(--ink)}

/* ── masthead ── */
header{padding:40px 0 18px}
.kick{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1{font-family:'Manifest',var(--sans);text-transform:uppercase;
  font-variation-settings:'MNFS' 100;font-weight:400;
  font-size:clamp(2.6rem,10vw,4.2rem);line-height:.95;letter-spacing:.01em;margin:14px 0 0}
.sub{color:var(--dim);font-size:.95rem;max-width:54ch;margin-top:12px}
.readout{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.readout b{color:var(--ink);font-weight:500}
.readout .sep{color:var(--rule)}

/* ── tiles ── */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:22px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--panel);padding:14px 16px 12px}
.tile .lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tile .val{font-family:var(--mono);font-weight:600;font-size:1.7rem;line-height:1.15;margin-top:6px}
.tile .val small{font-size:.62rem;font-weight:400;color:var(--dim);letter-spacing:.05em}
.tile .note{font-family:var(--mono);font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.tile.crit .val,.tile.crit .lbl{color:var(--crit)}
/* the one thing that has not happened yet takes the opal (R1) */
.tile.opal .val{background:var(--opal);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile.opal .val small{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--dim)}

/* ── sections ── */
section{border-top:1px solid var(--rule);margin-top:28px;padding-top:20px}
h2{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);font-weight:500;margin:0}
.why{color:var(--dim);font-size:.88rem;max-width:62ch;margin:6px 0 16px}

/* ── heatmap (github-grammar calendar, sequential blue = magnitude) ── */
.cal{position:relative;overflow-x:auto;padding-bottom:22px}
.cal-in{position:relative;display:inline-block}
.cal table{border-collapse:separate;border-spacing:4px}
.cal td,.cal th{padding:0}
.cal th{font-family:var(--mono);font-size:.56rem;font-weight:400;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);text-align:left}
.cal th.day{width:44px;min-width:44px;padding-right:6px}
.cal th.wk{padding-bottom:5px;text-align:left}
.cell{width:23px;height:23px;border-radius:4px;position:relative;
  transition:transform .12s,box-shadow .12s}
.cell.f0{background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule)}
.cell.f1{background:var(--seq1)}
.cell.f2{background:var(--seq2)}
.cell.f3{background:var(--seq3)}
.cell.miss{background:var(--milk);box-shadow:inset 0 0 0 1px var(--rule)}
.cell.miss::after{content:"";position:absolute;inset:9.5px;border-radius:50%;background:var(--rule)}
.cell.future{background:var(--opal-wash)}
.cell.off{visibility:hidden}
.cell:hover{transform:scale(1.18);box-shadow:0 0 0 1.5px var(--ink)}
.cell.future:hover{box-shadow:0 0 0 1.5px var(--opal-solid)}
/* R3 — the lag mark */
.lag{position:absolute;top:22px;bottom:-4px;width:0;border-left:1.5px dashed var(--dim);pointer-events:none}
.lag i{position:absolute;bottom:-16px;left:5px;font-style:normal;font-family:var(--mono);
  font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.legend{display:flex;align-items:center;gap:7px;margin-top:12px;
  font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.legend .cell{width:13px;height:13px;transition:none}
.legend .cell:hover{transform:none;box-shadow:inset 0 0 0 1px var(--rule)}

/* ── habit rows ── */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:120px 1fr 54px;align-items:center;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:none}
.row .name{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.row .rate{font-family:var(--mono);font-size:.85rem;font-weight:600;text-align:right}
.row .rate small{font-size:.56rem;font-weight:400;color:var(--dim)}
.row.crit .name,.row.crit .rate{color:var(--crit)}
.dots svg{display:block;width:100%;height:auto}

/* ── state charts (R2: envelope louder than the line) ── */
.sparks{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.sparks{grid-template-columns:1fr 1fr}}
.spark{background:var(--panel);border:1px solid var(--rule);padding:13px 16px 10px}
.spark .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.spark .lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.spark .mean{font-family:var(--mono);font-weight:600;font-size:1rem}
.spark .mean small{font-size:.56rem;font-weight:400;color:var(--dim);letter-spacing:.04em}
.spark.crit .mean,.spark.crit .lbl{color:var(--crit)}
.spark svg{display:block;width:100%;height:auto;margin-top:8px}

/* ── instrument check ── */
.issues{font-family:var(--mono);font-size:.66rem;line-height:2.1;color:var(--dim)}
.issues .crit{color:var(--crit)}
.fineprint{font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);padding:22px 0 44px;line-height:2}

footer{border-top:1px solid var(--rule)}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;padding:16px 20px;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}

/* tooltip */
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--milk);
  font-family:var(--mono);font-size:.62rem;letter-spacing:.03em;padding:6px 9px;border-radius:2px;
  opacity:0;transition:opacity .12s;white-space:nowrap}
#tip b{color:#fff}
#tip .o{background:var(--opal);-webkit-background-clip:text;background-clip:text;color:transparent}

.state-msg{text-align:center;padding:56px 20px;font-family:var(--mono);font-size:.68rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);line-height:2}

@media (prefers-reduced-motion: reduce){
  .cell,.cell:hover{transition:none;transform:none}
}
</style>
</head>

<script>
(function () {
  'use strict';

  /* ── the page's few opinions ─────────────────────────────────────────── */
  var SPRINT = { start: '2026-08-13', end: '2026-09-11', label: 'Sprint 13 Aug → 11 Sep' };
  var OFFER  = { label: 'The offer', date: '2026-11-09' };
  var WINDOW = 28;               // days in the habit rows
  var AHEAD  = 4;                // unmanifested days shown after the lag mark
  var SLEEP_FLOOR = 6.5;

  var FLOORS = [
    ['career_floor',   'Career'],
    ['product_floor',  'Product'],
    ['wellness_floor', 'Wellness'],
  ];
  var FOUNDATION = [
    ['meditation',    'Meditation'],
    ['journalled',    'Three lines'],
    ['lights_out_ok', 'Lights < 00:30'],
    ['sport',         'Sport'],
    ['family_time',   'Family'],
    ['judgment_drill','Drill'],
    ['systems_reps',  'Systems reps'],
  ];

  var INK = '#1B1A1E', DIM = '#84828C', RULE = '#DCDBD6', CRIT = '#B3261E';
  var OPAL_STOPS = '<stop offset="0" stop-color="#7E9CD8"/><stop offset=".34" stop-color="#B287C8"/>' +
                   '<stop offset=".68" stop-color="#6FB5A5"/><stop offset="1" stop-color="#8E93D8"/>';
  var svgN = 0;

  /* ── helpers ─────────────────────────────────────────────────────────── */
  var tip = document.getElementById('tip');
  function showTip(html, x, y) {
    tip.innerHTML = html;
    tip.style.opacity = 1;
    var w = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(8, x - w / 2), innerWidth - w - 8) + 'px';
    tip.style.top = (y - 40) + 'px';
  }
  function hideTip() { tip.style.opacity = 0; }
  function hookTips(root) {
    root.querySelectorAll('[data-tip]').forEach(function (el) {
      el.addEventListener('mouseenter', function (e) { showTip(el.dataset.tip, e.clientX, e.clientY); });
      el.addEventListener('mousemove',  function (e) { showTip(el.dataset.tip, e.clientX, e.clientY); });
      el.addEventListener('mouseleave', hideTip);
    });
  }
  function isoAddDays(iso, n) {
    var d = new Date(iso + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }
  function dow(iso) { return (new Date(iso + 'T12:00:00Z').getUTCDay() + 6) % 7; } // Mon=0
  function esc(s){ return String(s).replace(/"/g,'&quot;'); }

  function span(byDate, lastDate, n, ahead) {
    var out = [];
    for (var i = n - 1; i >= 0; i--) out.push({ date: isoAddDays(lastDate, -i), rec: byDate[isoAddDays(lastDate, -i)] || null, future: false });
    for (var j = 1; j <= (ahead || 0); j++) out.push({ date: isoAddDays(lastDate, j), rec: null, future: true });
    return out;
  }

  /* ── habit dot row (record only — monochrome ink) ────────────────────── */
  function dotRow(cells, field) {
    var W = cells.length * 10;
    var s = '<svg viewBox="0 0 ' + W + ' 10" style="aspect-ratio:' + W + '/10" aria-hidden="true">';
    cells.forEach(function (c, i) {
      var cx = i * 10 + 5, done = c.rec && c.rec[field] === true;
      var t = c.date + ' — ' + (c.rec ? (done ? '<b>done</b>' : 'missed') : 'no note');
      var core = !c.rec
        ? '<circle cx="' + cx + '" cy="5" r="0.9" fill="' + RULE + '"/>'
        : done
          ? '<circle cx="' + cx + '" cy="5" r="2.6" fill="' + INK + '"/>'
          : '<circle cx="' + cx + '" cy="5" r="2.3" fill="none" stroke="' + DIM + '" stroke-width="0.8" opacity="0.65"/>';
      s += '<g data-tip="' + esc(t) + '"><rect x="' + (cx - 5) + '" y="0" width="10" height="10" fill="transparent"/>' + core + '</g>';
    });
    return s + '</svg>';
  }
  function rate(cells, field) {
    var seen = cells.filter(function (c) { return c.rec; });
    if (!seen.length) return null;
    return Math.round(100 * seen.filter(function (c) { return c.rec[field] === true; }).length / seen.length);
  }

  /* ── the calendar heatmap (github grammar, sequential blue) ──────────── */
  function heatmap(byDate, lastNote, today) {
    var start = SPRINT.start, end = SPRINT.end;
    var gridStart = isoAddDays(start, -dow(start));                 // back to Monday
    var gridEnd = isoAddDays(end, 6 - dow(end));                    // forward to Sunday
    var weeks = Math.round((daysBetween(gridStart, gridEnd) + 1) / 7);
    var DAYS = ['Mon', '', 'Wed', '', 'Fri', '', ''];
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var CELL = 27; // 23px cell + 4px spacing

    /* github grammar: a month label on the first week that enters it */
    var h = '<div class="cal"><div class="cal-in"><table><thead><tr><th class="day"></th>';
    var seenMonth = '';
    for (var w = 0; w < weeks; w++) {
      var monday = isoAddDays(gridStart, w * 7);
      var mo = monday.slice(5, 7);
      h += '<th class="wk">' + (mo !== seenMonth ? MONTHS[Number(mo) - 1] : '') + '</th>';
      seenMonth = mo;
    }
    h += '</tr></thead><tbody>';

    for (var r = 0; r < 7; r++) {
      h += '<tr><th class="day">' + DAYS[r] + '</th>';
      for (var c = 0; c < weeks; c++) {
        var date = isoAddDays(gridStart, c * 7 + r);
        var inSprint = date >= start && date <= end;
        var rec = byDate[date];
        var cls, t;
        if (!inSprint) { cls = 'off'; t = ''; }
        else if (date > lastNote) {
          cls = 'future';
          t = date + ' — <span class=o>unmanifested</span>';
        } else if (!rec) {
          cls = 'miss'; t = date + ' — no note';
        } else {
          var f = (rec.career_floor ? 1 : 0) + (rec.product_floor ? 1 : 0) + (rec.wellness_floor ? 1 : 0);
          cls = 'f' + f;
          var landed = FLOORS.filter(function (x) { return rec[x[0]] === true; }).map(function (x) { return x[1]; });
          t = date + ' — <b>' + f + '/3 floors</b>' + (f ? ' · ' + landed.join(' · ') : '') + (rec.green ? ' · <b>green</b>' : '');
        }
        h += '<td><div class="cell ' + cls + '"' + (t ? ' data-tip="' + esc(t) + '"' : '') + '></div></td>';
      }
      h += '</tr>';
    }
    h += '</tbody></table>';

    /* R3 — the lag mark after the last recorded day's column */
    var lagCol = Math.floor(daysBetween(gridStart, lastNote) / 7) + 1;
    var left = 4 + 44 + 6 + 4 + lagCol * CELL - 2; // spacing + day column + its padding
    h += '<div class="lag" style="left:' + left + 'px"><i>dashboards end here</i></div>';
    h += '</div></div>';

    h += '<div class="legend"><span>floors</span>' +
      '<div class="cell f0"></div><div class="cell f1"></div><div class="cell f2"></div><div class="cell f3"></div>' +
      '<span>0 → 3</span><span style="color:var(--rule)">/</span>' +
      '<div class="cell future"></div><span>unmanifested</span></div>';
    return h;
  }

  /* ── state chart: envelope > line (R2), lag mark + opal wash (R3) ────── */
  function chart(cells, field, opts) {
    opts = opts || {};
    var id = 'op' + (++svgN);
    var W = 300, H = 56, PX = 6, PT = 6, PB = 8;
    var n = cells.length;
    var vals = cells.map(function (c) { return c.rec && typeof c.rec[field] === 'number' ? c.rec[field] : null; });
    var real = vals.filter(function (v) { return v !== null; });
    if (real.length < 2) return '<svg viewBox="0 0 300 56" style="aspect-ratio:300/56"></svg>';

    var lo = opts.min != null ? opts.min : Math.min.apply(null, real);
    var hi = opts.max != null ? opts.max : Math.max.apply(null, real);
    if (opts.floor != null) { lo = Math.min(lo, opts.floor); hi = Math.max(hi, opts.floor); }
    if (hi === lo) { hi += 1; lo -= 1; }
    var X = function (i) { return PX + i * ((W - 2 * PX) / (n - 1)); };
    var Y = function (v) { return (H - PB) - ((v - lo) / (hi - lo)) * (H - PT - PB); };

    var lastIdx = -1;
    cells.forEach(function (c, i) { if (!c.future) lastIdx = i; });

    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="aspect-ratio:' + W + '/' + H + '" aria-hidden="true">';
    s += '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="0">' + OPAL_STOPS + '</linearGradient></defs>';

    /* R3: the unmanifested region, right of the lag mark */
    var lagX = X(lastIdx) + ((W - 2 * PX) / (n - 1)) / 2;
    s += '<rect x="' + lagX + '" y="0" width="' + (W - lagX) + '" height="' + H + '" fill="url(#' + id + ')" opacity="0.16"/>';
    s += '<line x1="' + lagX + '" x2="' + lagX + '" y1="0" y2="' + H + '" stroke="' + DIM + '" stroke-width="0.8" stroke-dasharray="3 3"/>';

    /* R2: the envelope — rolling ±3-day min/max, louder than the line */
    var up = [], lopts = [];
    for (var i = 0; i <= lastIdx; i++) {
      var wv = [];
      for (var k = Math.max(0, i - 3); k <= Math.min(lastIdx, i + 3); k++) if (vals[k] !== null) wv.push(vals[k]);
      if (wv.length >= 2) {
        up.push(X(i).toFixed(1) + ',' + Y(Math.max.apply(null, wv)).toFixed(1));
        lopts.push(X(i).toFixed(1) + ',' + Y(Math.min.apply(null, wv)).toFixed(1));
      }
    }
    if (up.length >= 2)
      s += '<polygon points="' + up.join(' ') + ' ' + lopts.reverse().join(' ') + '" fill="' + DIM + '" opacity="0.20"/>';

    /* threshold — a status claim, marked and labelled, never a series color */
    if (opts.floor != null) {
      s += '<line x1="0" x2="' + lagX + '" y1="' + Y(opts.floor) + '" y2="' + Y(opts.floor) +
           '" stroke="' + CRIT + '" stroke-width="0.7" stroke-dasharray="2.5 2.5" opacity="0.75"/>';
    }

    /* the record: a thin ink line — the mean is the last to know */
    var runs = [], cur = [];
    for (var j = 0; j <= lastIdx; j++) {
      if (vals[j] === null) { if (cur.length) runs.push(cur); cur = []; continue; }
      cur.push(X(j).toFixed(1) + ',' + Y(vals[j]).toFixed(1));
    }
    if (cur.length) runs.push(cur);
    runs.forEach(function (r) {
      if (r.length === 1) s += '<circle cx="' + r[0].split(',')[0] + '" cy="' + r[0].split(',')[1] + '" r="2" fill="' + INK + '"/>';
      else s += '<polyline points="' + r.join(' ') + '" fill="none" stroke="' + INK + '" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>';
    });
    for (var m = 0; m <= lastIdx; m++) {
      if (vals[m] === null) continue;
      var bad = opts.floor != null && (opts.invert ? vals[m] > opts.floor : vals[m] < opts.floor);
      s += '<g data-tip="' + cells[m].date + ' — <b>' + vals[m] + '</b>' + (bad ? ' ⚑ off floor' : '') + '">' +
        '<rect x="' + (X(m) - 5) + '" y="0" width="10" height="' + H + '" fill="transparent"/>' +
        '<circle cx="' + X(m) + '" cy="' + Y(vals[m]) + '" r="2" fill="' + (bad ? CRIT : INK) + '"/></g>';
    }
    return s + '</svg>';
  }

  function mean(cells, field, n) {
    var past = cells.filter(function (c) { return !c.future; });
    var tail = past.slice(-n).map(function (c) { return c.rec && typeof c.rec[field] === 'number' ? c.rec[field] : null; })
      .filter(function (v) { return v !== null; });
    if (!tail.length) return null;
    return tail.reduce(function (a, b) { return a + b; }, 0) / tail.length;
  }
  var f1 = function (v) { return v === null ? '—' : (Math.round(v * 10) / 10).toFixed(1); };

  /* ── build ───────────────────────────────────────────────────────────── */
  function refresh() {
  fetch('habits.json?v=' + Math.floor(Date.now() / 60000), { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var days = data.days || [];
      if (!days.length) throw new Error('empty');
      var byDate = {};
      days.forEach(function (d) { byDate[d.date] = d; });
      var last = days[days.length - 1].date;
      var today = new Date().toISOString().slice(0, 10);
      var cells = span(byDate, last, WINDOW, AHEAD);

      document.getElementById('rDays').textContent = days.length;
      document.getElementById('rGen').textContent = (data.generated || '').slice(0, 10);

      var silence = 0;
      for (var i = days.length - 1; i >= 0 && days[i].career_floor !== true; i--) silence++;
      var greens = days.filter(function (d) { return d.green; }).length;
      var s7 = mean(cells, 'sleep_hours', 7);
      var offerDays = Math.max(0, daysBetween(today, OFFER.date));

      var html = '';

      /* tiles — the record in ink; the offer, unmanifested, takes the opal */
      html += '<div class="tiles">';
      html += tile('Green days', greens + '<small> /' + days.length + '</small>', 'all three floors, one day', greens === 0 ? 'crit' : '');
      html += tile('Career silence', silence + '<small> days</small>', silence >= 3 ? '⚑ since the floor last landed' : 'since the floor last landed', silence >= 3 ? 'crit' : '');
      html += tile('Sleep · 7d', f1(s7) + '<small> h</small>', (s7 !== null && s7 < SLEEP_FLOOR ? '⚑ ' : '') + 'floor ' + SLEEP_FLOOR + ' h', s7 !== null && s7 < SLEEP_FLOOR ? 'crit' : '');
      html += tile(OFFER.label, offerDays + '<small> days</small>', OFFER.date + ' · unmanifested', 'opal');
      html += '</div>';

      /* the sprint calendar */
      html += '<section><h2>' + SPRINT.label + '</h2>' +
        '<p class="why">One cell per day, depth is how many floors landed. Right of the dashed line is the opal: arrived, not yet manifested.</p>' +
        heatmap(byDate, last, today) + '</section>';

      /* floors */
      html += '<section><h2>The floors — last ' + WINDOW + ' days</h2>' +
        '<p class="why">The streak counts the floor, never the target.</p><div class="rows">';
      FLOORS.forEach(function (f) {
        var r = rate(cells, f[0]);
        html += row(f[1], dotRow(cells.filter(function (c) { return !c.future; }), f[0]),
          r === null ? '—' : String(r), f[0] === 'career_floor' && (r || 0) < 15);
      });
      html += '</div></section>';

      /* foundation */
      html += '<section><h2>Foundation & reps</h2>' +
        '<p class="why">Capacity, not achievement. A missing dot is a missing note, not a miss.</p><div class="rows">';
      FOUNDATION.forEach(function (f) {
        var r = rate(cells, f[0]);
        html += row(f[1], dotRow(cells.filter(function (c) { return !c.future; }), f[0]), r === null ? '—' : String(r), false);
      });
      html += '</div></section>';

      /* state */
      html += '<section><h2>State</h2>' +
        '<p class="why">The band is the week’s spread; the line is the day. The mean is the last to know.</p>' +
        '<div class="sparks">';
      html += spark('Sleep h', cells, 'sleep_hours', { floor: SLEEP_FLOOR }, ' h');
      html += spark('Bedtime, min past 00:00', cells, 'sleep_at_rel', { floor: 30, invert: true }, ' min', true);
      html += spark('Mood', cells, 'mood', { min: 1, max: 5 }, '');
      html += spark('Energy', cells, 'energy', { min: 1, max: 5 }, '');
      html += spark('Focus', cells, 'focus', { min: 1, max: 5 }, '');
      html += '</div></section>';

      /* instrument check */
      if ((data.issues || []).length) {
        html += '<section><h2>Instrument check</h2>' +
          '<p class="why">Values the exporter refused — excluded from every number above. Fix them in the vault.</p><div class="issues">';
        data.issues.forEach(function (i) {
          html += '<div><span class="crit">⚑</span> ' + i.date + ' · ' + i.field + ': ' + i.value + ' — ' + i.why + '</div>';
        });
        html += '</div></section>';
      }

      html += '<div class="fineprint">ink = the record · opal = the unmanifested · frontmatter only, exported by tools/export-habits.mjs</div>';

      var main = document.getElementById('main');
      main.innerHTML = html;
      hookTips(main);

      function tile(lbl, val, note, cls) {
        return '<div class="tile ' + (cls || '') + '"><div class="lbl">' + lbl +
          '</div><div class="val">' + val + '</div><div class="note">' + note + '</div></div>';
      }
      function row(name, dots, r, crit) {
        return '<div class="row' + (crit ? ' crit' : '') + '"><div class="name">' + name +
          '</div><div class="dots">' + dots + '</div><div class="rate">' + r + '<small>%</small></div></div>';
      }
      function spark(lbl, cells, field, opts, unit, invert) {
        var m7 = mean(cells, field, 7);
        var alert = opts.floor != null && m7 !== null && (invert ? m7 > opts.floor : m7 < opts.floor);
        return '<div class="spark' + (alert ? ' crit' : '') + '"><div class="top"><span class="lbl">' + lbl +
          '</span><span class="mean">' + f1(m7) + '<small>' + unit + ' · 7d</small></span></div>' +
          chart(cells, field, opts) + '</div>';
      }
    })
    .catch(function (e) {
      document.getElementById('main').innerHTML =
        '<div class="state-msg">No data — habits.json missing or unreadable (' + e.message + ')<br>run: node tools/export-habits.mjs</div>';
    });
  }

  refresh();

  /* live mode: served by tools/serve-habits.mjs, every vault save re-renders */
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && window.EventSource) {
    try { new EventSource('/events').onmessage = function () { hideTip(); refresh(); }; } catch (e) {}
  }
})();
</script>
