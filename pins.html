<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pins — Artem Domozhakov</title>
<meta name="description" content="A listed collection of findings and curiosities.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#eceae3">

<meta property="og:title" content="Pins — Artem Domozhakov">
<meta property="og:description" content="A listed collection of findings and curiosities.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://orchimada.github.io/pins.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/styles/system.css">
<style>
  .pins-wrap{max-width:1000px;margin:0 auto;padding:0 20px}

  /* ── masthead ── */
  .pins-head{padding:34px 0 22px}
  .pins-head h1{font-family:var(--disp);font-size:clamp(2rem,9vw,3rem);font-weight:700;letter-spacing:-.04em;line-height:1;margin:14px 0 0}
  .pins-head .sub{font-size:.98rem;color:var(--soft);margin-top:12px;max-width:44ch;line-height:1.6}
  .pins-head .readout{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin-top:16px;display:flex;align-items:center;gap:9px}
  .pins-head .readout b{color:var(--ink);font-weight:500}

  /* ── grouped rubric panel (scrolls away; every tag is on screen) ── */
  .rubrics{border-top:1px solid var(--line);padding:14px 0 4px}
  /* On a phone the label rides inline with its own chips — a label per row
     would push the first pin most of a screen down. */
  .tgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0}
  .tgroup + .tgroup{border-top:1px dashed var(--line)}

  .glabel{flex:0 0 auto;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);background:none;border:none;padding:4px 8px 4px 0;cursor:pointer;text-align:left;display:flex;align-items:center;gap:7px;transition:color .15s}
  .glabel::before{content:"";width:6px;height:6px;border-radius:50%;background:#cfcdc3;flex:0 0 auto;transition:background .15s,box-shadow .15s}
  .glabel:hover{color:var(--ink)}
  .glabel.on{color:var(--sig)}
  .glabel.on::before{background:var(--sig);box-shadow:0 0 7px var(--sig)}

  .grow{display:flex;flex-wrap:wrap;gap:6px}

  .chip{font-family:var(--mono);font-size:.66rem;letter-spacing:.02em;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 7px 5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s,color .15s}
  .chip:hover{border-color:var(--grey)}
  .chip i{font-style:normal;font-family:var(--mono);font-size:.6rem;font-weight:600;color:var(--sig);background:#fdecec;border-radius:5px;padding:2px 5px 1px;min-width:19px;text-align:center;transition:background .15s,color .15s}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.on i{background:var(--sig);color:#fff}

  /* ── sticky deck: search + what is currently on ── */
  .deckbar{position:sticky;top:58px;z-index:60;background:rgba(236,234,227,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0}
  .deckbar .pins-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:9px}

  .srch{flex:1 1 240px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:0 13px;min-width:0}
  .srch .d{width:7px;height:7px;border-radius:50%;background:var(--grey);flex:0 0 auto;transition:background .2s}
  .srch.active .d{background:var(--sig);box-shadow:0 0 7px var(--sig)}
  .srch input{flex:1;border:none;background:none;outline:none;font-family:var(--mono);font-size:.82rem;color:var(--ink);padding:11px 0;min-width:0}
  .srch input::placeholder{color:var(--grey);text-transform:uppercase;font-size:.68rem;letter-spacing:.06em}

  .active-sum{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;color:var(--grey)}
  .active-sum .on-tag{background:var(--ink);color:#fff;border-radius:100px;padding:4px 9px 3px}
  .reset{font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;color:var(--sig);background:none;border:1px solid var(--line);border-radius:100px;padding:6px 12px 5px;cursor:pointer}
  .reset:hover{border-color:var(--sig)}

  /* ── feed: two columns, newest first, filling left→right ── */
  .feed{display:grid;grid-template-columns:1fr;gap:10px;align-items:start;padding:18px 0 40px;min-height:50vh}

  .pin{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;text-decoration:none;color:inherit;transition:border-color .18s,box-shadow .18s,transform .18s}
  .pin:active{transform:scale(.994)}
  @media(hover:hover){.pin:hover{border-color:#cfcdc3;box-shadow:0 8px 24px rgba(20,20,22,.06)}}

  .pin .thumb{position:relative;flex:0 0 auto;width:58px;height:58px;border-radius:10px;overflow:hidden;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .pin .thumb .mark{font-family:var(--dot);font-size:1.5rem;line-height:1;color:var(--grey);text-transform:uppercase}
  /* The image lies over the letter. A host that blocks hotlinking or 404s
     removes the img and the mark underneath shows — never an empty frame. */
  /* No background here on purpose: while the image is still loading it stays
     transparent and the letter shows through, rather than a blank grey box. */
  .pin .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

  .pin .body{flex:1;min-width:0}
  .pin .ttl{display:block;font-family:var(--disp);font-size:1rem;font-weight:600;letter-spacing:-.015em;line-height:1.3;overflow-wrap:anywhere}
  .pin .meta{font-family:var(--mono);font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;color:var(--grey);margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .pin .meta .host{color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
  .pin .meta .sep{color:var(--line)}
  .pin .note{display:block;font-size:.9rem;color:var(--soft);line-height:1.55;margin-top:9px;overflow-wrap:anywhere}
  .pin mark{background:#fdecec;color:var(--ink);border-radius:3px;padding:0 2px}
  .pin .tgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .pin .tgs .tag{font-size:.57rem;padding:3px 9px;letter-spacing:.05em}
  .pin .tgs .tag.hit{background:#fdecec;border-color:#f6c9c9;color:#b51a1a}

  .state{grid-column:1/-1;text-align:center;padding:56px 20px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);line-height:2}
  .state b{display:block;color:var(--ink);font-size:.8rem}
  .state .sig{color:var(--sig)}

  @media(min-width:720px){
    .pins-wrap{padding:0 30px}
    .feed{grid-template-columns:1fr 1fr;gap:12px}
    .tgroup{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:baseline}
    .glabel{padding-top:7px}
    .pin{padding:18px 20px;gap:16px}
    .pin .thumb{width:72px;height:72px}
    .pin .ttl{font-size:1.05rem}
  }
</style>
</head>
<body>

<nav class="nav"><div class="nav-in">
  <a class="brand" href="index.html"><span class="d"></span>ARTEM DOMOZHAKOV</a>
  <div class="links">
    <a href="index.html#experience">Experience</a><a href="index.html#highlights">Highlights</a>
    <a class="cta" href="index.html#contact">Contact</a>
  </div>
</div></nav>

<header class="pins-head"><div class="pins-wrap">
  <span class="kick"><span class="n">05</span>Field notes</span>
  <h1>Pins.</h1>
  <p class="sub">A listed collection of findings and curiosities.</p>
  <div class="readout"><span class="led" id="ledStatus"></span><b id="cntPins">—</b> pins <span style="color:var(--line)">/</span> <b id="cntTags">—</b> rubrics</div>
</div></header>

<section class="rubrics"><div class="pins-wrap" id="rubrics"></div></section>

<div class="deckbar"><div class="pins-wrap">
  <label class="srch" id="srchBox">
    <span class="d"></span>
    <input id="q" type="search" placeholder="Filter pins" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
  </label>
  <div class="active-sum" id="activeSum"></div>
</div></div>

<main class="feed pins-wrap" id="feed">
  <div class="state"><b>Loading</b><span class="sig">···</span></div>
</main>

<footer class="ft"><div class="pins-wrap" style="display:flex;flex-wrap:wrap;gap:10px 24px">
  <span>© 2026 A. Domozhakov</span><a href="index.html">home</a><a href="cv.html">classic view</a><a href="https://github.com/orchimada" target="_blank" rel="noopener">GitHub</a>
</div></footer>

<script>
(function(){
  var feed    = document.getElementById('feed'),
      panel   = document.getElementById('rubrics'),
      sumEl   = document.getElementById('activeSum'),
      qIn     = document.getElementById('q'),
      box     = document.getElementById('srchBox'),
      led     = document.getElementById('ledStatus');

  /* Rubrics carry two different meanings: what a pin is ABOUT, and what FORM
     it takes. Grouping along that split is the only honest grouping — it is
     the same split the import pipeline writes.

     Tags absent from this map are not dropped; they collect under "Other", so
     a new #hashtag typed into Telegram shows up without touching this file. */
  var TAG_GROUPS = [
    ['Software', ['swe','cs','ai','claude','security','data','engineering','programmingmath']],
    ['Hardware', ['hardware','robotics','keyboards']],
    ['Craft',    ['product','design','productivity','ux','fintech']],
    ['Ideas',    ['ideas','learning','math']],
    ['Culture',  ['games','music']],
    ['Form',     ['article','tool','repo','book','guide','interactive','blog',
                  'paper','reference','media','podcast','talk']]
  ];
  var CATCH_ALL = 'Other';

  var PINS = [], sel = [], q = '', COUNTS = {};

  /* ── helpers ── */
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Only http(s) survives — a pin's url comes from an external pipeline.
  function safeUrl(u){
    try{ var p = new URL(u); return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : ''; }
    catch(e){ return ''; }
  }

  function host(p){
    if(p.site) return p.site.replace(/^www\./,'');
    try{ return new URL(p.url).hostname.replace(/^www\./,''); }catch(e){ return ''; }
  }

  function when(ts){
    var t = Date.parse(ts);
    if(isNaN(t)) return '';
    var d = Math.floor((Date.now() - t) / 86400000);
    if(d <= 0) return 'today';
    if(d === 1) return 'yesterday';
    if(d < 7)  return d + 'd ago';
    if(d < 28) return Math.floor(d / 7) + 'w ago';
    return new Date(t).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' });
  }

  function hilite(text, needle){
    var out = esc(text);
    if(!needle) return out;
    var re = new RegExp('(' + needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig');
    return out.replace(re,'<mark>$1</mark>');
  }

  /* ── filtering: selected rubrics are OR'd, then the search is AND'd ── */
  function matches(p){
    var tags = p.tags || [];
    if(sel.length){
      var hit = false;
      for(var i = 0; i < sel.length; i++) if(tags.indexOf(sel[i]) !== -1){ hit = true; break; }
      if(!hit) return false;
    }
    if(!q) return true;
    return [p.title, p.note, host(p)].concat(tags).join(' ').toLowerCase().indexOf(q) !== -1;
  }

  /* ── render ── */
  function card(p){
    var url = safeUrl(p.url);
    if(!url) return '';
    var h = host(p), img = safeUrl(p.image),
        title = p.title || h || url,
        tags = (p.tags || []).map(function(t){
          return '<span class="tag' + (sel.indexOf(t) !== -1 ? ' hit' : '') + '">#' + esc(t) + '</span>';
        }).join('');

    return '<a class="pin" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="thumb"><span class="mark">' + esc((h || '?').charAt(0)) + '</span>' +
        (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : '') +
      '</span>' +
      '<span class="body">' +
        '<span class="ttl">' + hilite(title, q) + '</span>' +
        '<span class="meta"><span class="host">' + esc(h) + '</span>' +
          '<span class="sep">/</span><span>' + esc(when(p.ts)) + '</span></span>' +
        (p.note ? '<span class="note">' + hilite(p.note, q) + '</span>' : '') +
        (tags ? '<span class="tgs">' + tags + '</span>' : '') +
      '</span></a>';
  }

  function render(){
    var shown = PINS.filter(matches);

    feed.innerHTML = shown.length
      ? shown.map(card).join('')
      : '<div class="state"><b>Nothing here</b>no pin matches that filter</div>';

    // chip + group-label state
    Array.prototype.forEach.call(panel.querySelectorAll('.chip'), function(el){
      var on = sel.indexOf(el.dataset.tag) !== -1;
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', on);
    });
    Array.prototype.forEach.call(panel.querySelectorAll('.glabel'), function(el){
      var members = el.dataset.tags.split(',');
      var all = members.length && members.every(function(t){ return sel.indexOf(t) !== -1; });
      el.classList.toggle('on', all);
      el.setAttribute('aria-pressed', all);
    });

    // sticky summary
    sumEl.innerHTML = (sel.length || q)
      ? sel.map(function(t){ return '<span class="on-tag">#' + esc(t) + '</span>'; }).join('') +
        '<button class="reset" type="button" id="reset">clear</button>'
      : '<span>all ' + PINS.length + '</span>';
    var r = document.getElementById('reset');
    if(r) r.addEventListener('click', reset);

    document.getElementById('cntPins').textContent = shown.length;
    box.classList.toggle('active', !!q);
  }

  function buildRubrics(){
    COUNTS = {};
    PINS.forEach(function(p){
      (p.tags || []).forEach(function(t){ COUNTS[t] = (COUNTS[t] || 0) + 1; });
    });
    var all = Object.keys(COUNTS);
    document.getElementById('cntTags').textContent = all.length;

    var mapped = {};
    TAG_GROUPS.forEach(function(g){ g[1].forEach(function(t){ mapped[t] = 1; }); });
    var groups = TAG_GROUPS.concat([[CATCH_ALL, all.filter(function(t){ return !mapped[t]; })]]);

    panel.innerHTML = groups.map(function(g){
      // Only tags that actually occur, biggest first.
      var members = g[1].filter(function(t){ return COUNTS[t]; })
                        .sort(function(a,b){ return COUNTS[b] - COUNTS[a] || a.localeCompare(b); });
      if(!members.length) return '';
      return '<div class="tgroup">' +
        '<button class="glabel" type="button" data-tags="' + esc(members.join(',')) + '">' + esc(g[0]) + '</button>' +
        '<div class="grow">' + members.map(function(t){
          return '<button class="chip" type="button" data-tag="' + esc(t) + '">#' +
                 esc(t) + '<i>' + COUNTS[t] + '</i></button>';
        }).join('') + '</div></div>';
    }).join('');

    Array.prototype.forEach.call(panel.querySelectorAll('.chip'), function(el){
      el.addEventListener('click', function(){ toggle(el.dataset.tag); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll('.glabel'), function(el){
      el.addEventListener('click', function(){ toggleGroup(el.dataset.tags.split(',')); });
    });
  }

  /* ── selection ── */
  function toggle(t){
    var i = sel.indexOf(t);
    if(i === -1) sel.push(t); else sel.splice(i, 1);
    render();
  }

  // A group label is a shortcut for its whole row: all on → clear them, else add.
  function toggleGroup(members){
    var all = members.every(function(t){ return sel.indexOf(t) !== -1; });
    members.forEach(function(t){
      var i = sel.indexOf(t);
      if(all && i !== -1) sel.splice(i, 1);
      else if(!all && i === -1) sel.push(t);
    });
    render();
  }

  function reset(){ sel = []; q = ''; qIn.value = ''; qIn.blur(); render(); }

  /* ── controls ── */
  var timer;
  qIn.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){ q = qIn.value.trim().toLowerCase(); render(); }, 120);
  });
  qIn.addEventListener('keydown', function(e){ if(e.key === 'Escape') reset(); });

  /* ── load ── */
  // GitHub Pages caches JSON for ~10 min; the stamp makes a fresh pin show up now.
  fetch('pins.json?v=' + Math.floor(Date.now() / 60000), { cache: 'no-cache' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){
      PINS = (Array.isArray(data) ? data : data.pins || [])
        .filter(function(p){ return p && safeUrl(p.url); })
        .sort(function(a, b){ return Date.parse(b.ts || 0) - Date.parse(a.ts || 0); });
      buildRubrics();
      render();
    })
    .catch(function(err){
      led.classList.add('r');
      feed.innerHTML = '<div class="state"><b>Feed unavailable</b>' + esc(err.message) + '</div>';
      document.getElementById('cntPins').textContent = '0';
      document.getElementById('cntTags').textContent = '0';
    });
})();
</script>
</body>
</html>
